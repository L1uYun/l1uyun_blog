<section class="read-aloud" data-read-aloud data-article-selector="#article-content" aria-labelledby="read-aloud-title">
  <div class="read-aloud__header">
    <div class="read-aloud__intro">
      <h3 id="read-aloud-title">听这篇文章</h3>
      <p>Gemini 声情朗读，暂不可用时自动切换设备声音。</p>
    </div>
    <div class="read-aloud__actions" role="group" aria-label="朗读控制">
      <button class="read-aloud__button read-aloud__button--primary" type="button" data-reader-toggle aria-describedby="read-aloud-status">
        <svg data-reader-icon-play viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M8 5.6v12.8L18 12 8 5.6Z" fill="currentColor" />
        </svg>
        <svg data-reader-icon-pause viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" hidden>
          <rect x="7" y="5.5" width="3.5" height="13" rx="1" fill="currentColor" />
          <rect x="13.5" y="5.5" width="3.5" height="13" rx="1" fill="currentColor" />
        </svg>
        <svg data-reader-icon-loading viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" hidden>
          <circle cx="6" cy="12" r="1.8" fill="currentColor" />
          <circle cx="12" cy="12" r="1.8" fill="currentColor" />
          <circle cx="18" cy="12" r="1.8" fill="currentColor" />
        </svg>
        <span data-reader-toggle-label>开始朗读</span>
      </button>
      <button class="read-aloud__button" type="button" data-reader-stop disabled>
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false">
          <rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" />
        </svg>
        <span>停止</span>
      </button>
    </div>
  </div>

  <progress class="read-aloud__progress" data-reader-progress max="1" value="0" aria-label="朗读进度"></progress>

  <details class="read-aloud__settings">
    <summary>声音与语速</summary>
    <div class="read-aloud__settings-grid">
      <label class="read-aloud__field">
        <span>朗读声音</span>
        <select data-reader-voice aria-describedby="read-aloud-voice-note">
          <optgroup label="Gemini AI 声音">
            <option value="gemini:Vindemiatrix">Vindemiatrix · 温柔舒缓（推荐）</option>
            <option value="gemini:Achernar">Achernar · 柔和安静</option>
            <option value="gemini:Sulafat">Sulafat · 温暖叙事</option>
            <option value="gemini:Kore">Kore · 坚定清晰</option>
            <option value="gemini:Aoede">Aoede · 轻盈自然</option>
            <option value="gemini:Charon">Charon · 知性讲述</option>
          </optgroup>
          <optgroup label="设备声音">
            <option value="browser:">系统默认</option>
          </optgroup>
        </select>
        <small id="read-aloud-voice-note" data-reader-voice-note>AI 声音更有表现力；失败时自动使用设备声音。</small>
      </label>

      <label class="read-aloud__field read-aloud__field--rate">
        <span>语速 <output data-reader-rate-output>1.00×</output></span>
        <input data-reader-rate type="range" min="0.75" max="1.35" step="0.05" value="1" aria-label="朗读语速">
      </label>

      <label class="read-aloud__tone">
        <input data-reader-expressive type="checkbox" checked>
        <span>
          <strong>自然语气</strong>
          <small>AI 使用温暖、有层次的叙事；设备声音按标点调整节奏。</small>
        </span>
      </label>
    </div>
  </details>

  <p class="read-aloud__status" id="read-aloud-status" data-reader-status role="status" aria-live="polite" aria-atomic="true">
    正在准备朗读内容…
  </p>
  <noscript><p class="read-aloud__status">请启用 JavaScript 后使用朗读功能。</p></noscript>
</section>
